<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="880" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">main.c — module hierarchy</text>
  <text x="600" y="63" text-anchor="middle" font-size="13" fill="#64748b">signal-path-intan / master</text>

  <!-- left layer labels -->
  <text x="30" y="165" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">APPLICATION</text>
  <text x="30" y="365" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">CONTROL</text>
  <text x="30" y="592" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">PROTOCOL</text>
  <text x="30" y="762" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">HARDWARE</text>

  <!-- ============ 6. BLE PACKETIZER (top) ============ -->
  <g>
    <rect x="400" y="95" width="400" height="140" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="400" y="95" width="400" height="40" rx="12" fill="#16a34a"/>
    <rect x="400" y="121" width="400" height="14" fill="#16a34a"/>
    <text x="600" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6 · BLE PACKETIZER</text>
    <text x="418" y="158" font-size="11.5" font-family="monospace" fill="#15803d">main() streaming loop</text>
    <text x="418" y="182" font-size="12"><tspan font-weight="700" fill="#166534">IN</tspan><tspan fill="#1f2937">   ring[] via r_idx</tspan></text>
    <text x="418" y="201" font-size="12"><tspan font-weight="700" fill="#166534">PROC</tspan><tspan fill="#1f2937"> pack 121 samples + seq into one packet</tspan></text>
    <text x="418" y="220" font-size="12"><tspan font-weight="700" fill="#166534">OUT</tspan><tspan fill="#1f2937">  bt_gatt_notify()</tspan></text>
  </g>

  <!-- ============ 3. INTAN CONFIGURATION ============ -->
  <g>
    <rect x="120" y="300" width="320" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="120" y="300" width="320" height="40" rx="12" fill="#475569"/>
    <rect x="120" y="326" width="320" height="14" fill="#475569"/>
    <text x="280" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 · INTAN CONFIG</text>
    <text x="138" y="363" font-size="11.5" font-family="monospace" fill="#475569">intan_init()</text>
    <text x="138" y="387" font-size="12"><tspan font-weight="700" fill="#334155">IN</tspan><tspan fill="#1f2937">   (none)</tspan></text>
    <text x="138" y="406" font-size="12"><tspan font-weight="700" fill="#334155">PROC</tspan><tspan fill="#1f2937"> write config regs + CALIBRATE, once</tspan></text>
    <text x="138" y="425" font-size="12"><tspan font-weight="700" fill="#334155">OUT</tspan><tspan fill="#1f2937">  side effect: chip state changes</tspan></text>
  </g>

  <!-- ============ 5. SAMPLING ============ -->
  <g>
    <rect x="480" y="300" width="320" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="480" y="300" width="320" height="40" rx="12" fill="#475569"/>
    <rect x="480" y="326" width="320" height="14" fill="#475569"/>
    <text x="640" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5 · SAMPLING</text>
    <text x="498" y="363" font-size="11.5" font-family="monospace" fill="#475569">sampler_thread()</text>
    <text x="498" y="387" font-size="12"><tspan font-weight="700" fill="#334155">IN</tspan><tspan fill="#1f2937">   notify_enabled (gate)</tspan></text>
    <text x="498" y="406" font-size="12"><tspan font-weight="700" fill="#334155">PROC</tspan><tspan fill="#1f2937"> CONVERT at fixed rate (timer)</tspan></text>
    <text x="498" y="425" font-size="12"><tspan font-weight="700" fill="#334155">OUT</tspan><tspan fill="#1f2937">  writes ring[], advances w_idx</tspan></text>
  </g>

  <!-- ============ 4. BLE CONNECTION ============ -->
  <g>
    <rect x="840" y="300" width="320" height="160" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <rect x="840" y="300" width="320" height="40" rx="12" fill="#7c3aed"/>
    <rect x="840" y="326" width="320" height="14" fill="#7c3aed"/>
    <text x="1000" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4 · BLE CONNECTION</text>
    <text x="858" y="363" font-size="11.5" font-family="monospace" fill="#7c3aed">connected() / ccc_changed() / GATT svc</text>
    <text x="858" y="387" font-size="12"><tspan font-weight="700" fill="#6b21a8">IN</tspan><tspan fill="#1f2937">   callbacks from Zephyr's BT stack</tspan></text>
    <text x="858" y="406" font-size="12"><tspan font-weight="700" fill="#6b21a8">PROC</tspan><tspan fill="#1f2937"> react to connect / subscribe</tspan></text>
    <text x="858" y="425" font-size="12"><tspan font-weight="700" fill="#6b21a8">OUT</tspan><tspan fill="#1f2937">  one flag: notify_enabled</tspan></text>
  </g>

  <!-- ============ 2. COMMAND ENCODING ============ -->
  <g>
    <rect x="120" y="530" width="680" height="130" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="120" y="530" width="680" height="40" rx="12" fill="#2563eb"/>
    <rect x="120" y="556" width="680" height="14" fill="#2563eb"/>
    <text x="460" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 · COMMAND ENCODING</text>
    <text x="138" y="593" font-size="11.5" font-family="monospace" fill="#1d4ed8">CMD_READ  CMD_WRITE  CMD_CONVERT  CMD_CALIBRATE</text>
    <text x="138" y="617" font-size="12"><tspan font-weight="700" fill="#1e40af">IN</tspan><tspan fill="#1f2937">   register # / channel # / data byte</tspan>
      <tspan dx="30" font-weight="700" fill="#1e40af">PROC</tspan><tspan fill="#1f2937"> bit-pack per Intan protocol</tspan></text>
    <text x="138" y="636" font-size="12"><tspan font-weight="700" fill="#1e40af">OUT</tspan><tspan fill="#1f2937">  a 16-bit command word</tspan></text>
  </g>

  <!-- ============ 1. SPI TRANSPORT ============ -->
  <g>
    <rect x="120" y="700" width="680" height="130" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="120" y="700" width="680" height="40" rx="12" fill="#2563eb"/>
    <rect x="120" y="726" width="680" height="14" fill="#2563eb"/>
    <text x="460" y="726" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1 · SPI TRANSPORT</text>
    <text x="138" y="763" font-size="11.5" font-family="monospace" fill="#1d4ed8">xfer()</text>
    <text x="138" y="787" font-size="12"><tspan font-weight="700" fill="#1e40af">IN</tspan><tspan fill="#1f2937">   16-bit command word</tspan>
      <tspan dx="30" font-weight="700" fill="#1e40af">PROC</tspan><tspan fill="#1f2937"> CS low → clock word out/in → CS high</tspan></text>
    <text x="138" y="806" font-size="12"><tspan font-weight="700" fill="#1e40af">OUT</tspan><tspan fill="#1f2937">  16-bit reply</tspan></text>
  </g>

  <!-- ============ ARROWS ============ -->
  <!-- config -> encoding -->
  <path d="M280,460 L280,530" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <!-- sampling -> encoding -->
  <path d="M640,460 L640,530" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <!-- encoding -> transport -->
  <path d="M460,660 L460,700" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- sampling -> packetizer : ring buffer -->
  <path d="M640,300 L640,235" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="583" y="255" width="114" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="640" y="269" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">ring[] w/r idx</text>

  <!-- connection -> packetizer : notify_enabled -->
  <path d="M1000,300 C 1000,215 880,175 802,165" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="905" y="212" width="130" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="970" y="226" text-anchor="middle" font-size="11" font-family="monospace" fill="#6b21a8">notify_enabled</text>

  <!-- connection -> sampling : notify_enabled (label implied by the cards' OUT/IN lines) -->
  <path d="M840,380 L802,380" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
</svg>
