CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="cclosed-blerate"
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_PRINTK=y

# --- lever #1: fat notifications ---
# Bigger ATT payload (MTU-3 usable) + link-layer data length extension so a
# whole notification rides in one radio packet instead of being fragmented.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# --- lever #2: 2M PHY (+ link diagnostics) ---
# Double the on-air bitrate, and let us read back the negotiated PHY so we know
# whether the central actually accepted it.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# --- lever #3: pack the connection event ---
# Default host TX buffer count is 3, so only ~3 packets ride each connection
# event - THIS is the packets-per-second wall, not PHY. Raise the buffers so the
# controller can burst ~a full event's worth of packets each interval.
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_L2CAP_TX_BUF_COUNT=24
CONFIG_BT_CONN_TX_MAX=24
# BT_BUF_EVT_RX_COUNT must be > BT_BUF_ACL_TX_COUNT (stack invariant)
CONFIG_BT_BUF_EVT_RX_COUNT=25
