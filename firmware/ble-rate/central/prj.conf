CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_PRINTK=y

# We are the central, so we set the pace: big packets + 2M PHY + data-length ext.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Match the peripheral's stretched connection event so we keep listening long
# enough to receive the extra packets it packs into each event.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=20000

# Receive side was the untuned asymmetry: master queues into 24 TX buffers but
# we default to ~2 RX buffers, so we back-pressure the whole link. Match it.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=24
CONFIG_BT_BUF_EVT_RX_COUNT=25
